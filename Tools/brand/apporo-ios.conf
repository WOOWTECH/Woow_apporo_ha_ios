# Apporo aiot — iOS brand config
# 2026-09-14: 身分遷移至 com.apporo.aiot / Apporo aiot / apporoaiot / aiot.apporo.ai。
# 注意:rebrand-ios.sh 是一次性腳本(守門檢查 grep -q 'io.robbie' 現在會 die),
# 這個檔案現在只是身分值的記錄與下一個品牌的模板,改這裡不會改到已落地的原始碼。
BRAND_ID="apporo"
APP_NAME="Apporo aiot"
BUNDLE_ID_PREFIX="com.apporo"
BUNDLE_ID_BASE="aiot"                        # → com.apporo.aiot(與 Android applicationId 對齊)
BRAND_HOST="aiot.apporo.ai"                  # 舊值 aiot.apporo.io 的網域無 NS 紀錄、從未上線
PRIMARY_COLOR="8B6B24"                       # WCAG AA 修正色(原品牌 #C49E53 對比不足,ADR-0001)
PRIMARY_COLOR_TINT="E2D5B8"
URL_SCHEME="apporoaiot"                      # Debug 版另加 -dev 後綴(apporoaiot-dev),見 ENV_URL_HANDLER
LOGO_SRC="Tools/brand/assets/apporo-mark.png"    # 1024 去字鳥形 mark(Android 已處理)
ICON_BG="FFFFFF"                             # Android LAUNCHER_BG 白底
# blocker B-6:舊值是 Android client 的 GitHub Pages 頁面,iOS 不該借用 Android 身分。
# ⚠️ 這個頁面尚未上線。送審前必須確認:可匿名讀取、非 404、非登入頁、HTTPS 憑證有效,
#    且 HTML 內含 rel="redirect_uri" 指向 apporoaiot://auth-callback 與 apporoaiot-dev://auth-callback。
#    HA 的 IndieAuth 會在登入時實際抓取這個 URL。
OAUTH_CLIENT_ID="https://aiot.apporo.ai/ios"
